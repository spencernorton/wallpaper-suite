name: Bug report
description: A monitor shows the wrong image, rotation misbehaves, or the preferences or CLI fail.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove machine names, user names, personal paths and personal photos from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
      placeholder: After waking the monitors, one image was stretched across all three.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Output of `gnome-shell --version`, your monitor layout (sizes and scaling), and `wallpaper-suitectl status --json` if the CLI is installed.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant lines from `journalctl --user -b | grep -i wallpaper-suite`, scrubbed.
      render: text
