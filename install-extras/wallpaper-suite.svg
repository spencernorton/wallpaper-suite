<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c440"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33d17a"/>
      <stop offset="1" stop-color="#26a269"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background plate (Adwaita-like dark) -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="#241f31"/>
  <!-- Three monitor "wallpapers" arranged horizontally -->
  <g filter="url(#shadow)">
    <!-- Left monitor -->
    <rect x="16" y="40" width="28" height="42" rx="3" fill="url(#g1)"/>
    <circle cx="36" cy="50" r="3.5" fill="#f9f06b" opacity="0.85"/>
    <path d="M16 70 L24 60 L32 68 L44 56 L44 82 L16 82 Z" fill="#1a5fb4" opacity="0.6"/>
    <!-- Center monitor (slightly larger to feel primary) -->
    <rect x="48" y="34" width="32" height="48" rx="3" fill="url(#g2)"/>
    <circle cx="70" cy="46" r="4" fill="#fff7c7" opacity="0.9"/>
    <path d="M48 66 L56 56 L64 64 L80 50 L80 82 L48 82 Z" fill="#c64600" opacity="0.5"/>
    <!-- Right monitor -->
    <rect x="84" y="40" width="28" height="42" rx="3" fill="url(#g3)"/>
    <circle cx="103" cy="50" r="3.5" fill="#deddda" opacity="0.85"/>
    <path d="M84 70 L92 60 L100 68 L112 56 L112 82 L84 82 Z" fill="#0e5b2a" opacity="0.6"/>
  </g>
  <!-- Monitor stands (single bar tying them visually together) -->
  <rect x="16" y="86" width="96" height="3" rx="1.5" fill="#5e5c64"/>
  <rect x="60" y="86" width="8" height="10" fill="#5e5c64"/>
  <rect x="44" y="94" width="40" height="3" rx="1.5" fill="#5e5c64"/>
</svg>
